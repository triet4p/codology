[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codology"
dynamic = ["version"]
description = "Declarative static modeling primitives for ontology-as-code applications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.hatch.version]
path = "src/codology/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codology"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.400",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = [".venv", "artifacts", "experiments"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", "artifacts", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "SIM", "UP"]
